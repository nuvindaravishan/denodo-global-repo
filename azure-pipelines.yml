trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:\Users\hariharan.d\denodo\denodo-db-tools\bin'
  pipelineTmpPath: 'C:\Users\hariharan.d\Denodo\pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  
  # VDP Server Details (Global Workspace connects to /admin)
  vdpHost: 'devdenodo-9.iqzsystems.io'
  vdpPort: '9999'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # 1. Checkout repository with full commit history for commit comparison
  - checkout: self
    fetchDepth: 0

  # 2. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { 
          New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force 
      }
    displayName: 'Initialize Pipeline Folder'

# 3. Synchronize VDP Server and Generate Incremental Workspace Revision
  - powershell: |
      Set-Location "$(Build.SourcesDirectory)"
      
      # Extract exact commit range from Git merge
      $toCommit = (git rev-parse HEAD).Trim()
      $fromCommit = (git rev-parse HEAD~1).Trim()
      
      Write-Host "======================================================"
      Write-Host "Triggered by Commit (-tc): $toCommit"
      Write-Host "Comparing from      (-fc): $fromCommit"
      Write-Host "Target Database:           $env:vdbName"
      Write-Host "======================================================"

      $pullVqlPath = Join-Path "$(pipelineTmpPath)" "vcs_pull.vql"
      $outputVql   = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      # --- Step A: Write DVCSPULL command ---
      "DVCSPULL $env:vdbName;" | Out-File -FilePath $pullVqlPath -Encoding ascii -Force
      Write-Host "Created VCS pull file for $env:vdbName: $pullVqlPath"

      # Navigate into Denodo bin folder
      Write-Host "Navigating to Denodo bin directory: $(denodoPath)"
      Push-Location "$(denodoPath)"

      try {
          # --- Step B: Pull latest commits into resort360 ---
          Write-Host "Step 1: Pulling latest Git commits to $env:vdbName..."
          $serverParam = "//${env:vdpHost}:${env:vdpPort}/${env:vdbName}?$($env:VDP_USER)@$($env:VDP_PASSWORD)"
          
          .\import.bat --file "$pullVqlPath" --server "$serverParam"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "DVCSPULL failed with exit code $LASTEXITCODE."
              exit $LASTEXITCODE
          }
          Write-Host "Database $env:vdbName synchronized successfully."

          # --- Step C: Run export.bat --revision against resort360 ---
          Write-Host "Step 2: Generating incremental revision for $env:vdbName..."
          
          # Target /resort360 so export finds the commit just pulled
          .\export.bat --revision `
            -l "$env:VDP_USER" `
            -p "$env:VDP_PASSWORD" `
            -h "//${env:vdpHost}:${env:vdpPort}/${env:vdbName}" `
            -f "$outputVql" `
            -fc "$fromCommit" `
            -tc "$toCommit" `
            -P "includeprivileges=yes"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "export.bat failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          Write-Host "Incremental revision successfully generated at: $outputVql"
      }
      finally {
          Pop-Location
      }
    displayName: 'Sync VDP with Git and Generate Incremental Revision'
    env:
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)
      vdpHost: $(vdpHost)
      vdpPort: $(vdpPort)
      vdbName: $(vdbName)

  # 4. Verify Generated VQL Output in Build Logs
  - powershell: |
      $revisionFile = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"
      
      if (!(Test-Path $revisionFile)) {
          Write-Error "Revision file $revisionFile was not created."
          exit 1
      }

      $content = Get-Content $revisionFile -Raw
      Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
      Write-Host $content

      if ($content -match "No diff elements between commits" -or [string]::IsNullOrWhiteSpace($content)) {
          Write-Warning "No VQL differences found between commits. Verify that changes were saved, staged, and committed."
      }
    displayName: 'Verify Generated VQL Output'

  # 5. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 6. Deploy Revision via Solution Manager API
  - powershell: |
      # Check Sources directory first, fallback to pipelineTmpPath
      $scriptPath = Join-Path "$(Build.SourcesDirectory)" "base64revision.py"
      if (!(Test-Path $scriptPath)) {
          $scriptPath = Join-Path "$(pipelineTmpPath)" "base64revision.py"
      }

      $revisionVqlPath = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      Write-Host "Executing deployment script: $scriptPath"
      python "$scriptPath" `
        -s "$(smHost)" `
        -p "$(smPort)" `
        -v "$revisionVqlPath" `
        -n "Auto_Build_$(Build.BuildId)" `
        -d "Automated deployment from Azure Pipeline commit $(Build.SourceVersion)" `
        -e $(targetEnvId) `
        -u "$env:SM_USER" `
        -a "$env:SM_PASSWORD" `
        --protocol "http"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 7. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()