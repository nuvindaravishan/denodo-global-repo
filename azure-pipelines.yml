trigger:
  branches:
    include:
      - main

# Disables PR validation triggers so the pipeline runs ONLY after the PR is merged into main
pr: none

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:\Users\hariharan.d\denodo\denodo-db-tools\bin'
  pipelineTmpPath: 'C:\Users\hariharan.d\Denodo\pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  
  # Workspace revision connects to /admin
  server: '//devdenodo-9.iqzsystems.io:9999/admin'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoWorkspaceCI
  displayName: 'Denodo 9 Workspace Incremental CI/CD'
  steps:
  
  # 1. Full checkout to retrieve complete commit history
  - checkout: self
    fetchDepth: 0

  # 2. Initialize Directory
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { 
          New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force 
          Write-Host "Created pipeline directory at: $(pipelineTmpPath)"
      }
    displayName: 'Initialize Pipeline Folder'

  # 3. Resolve Commits & Generate Incremental Revision
  - powershell: |
      $ErrorActionPreference = 'Stop'
      Set-Location "$(Build.SourcesDirectory)"

      Write-Host "================= RECENT GIT HISTORY ================="
      git log --oneline -n 5
      Write-Host "======================================================"

      # 1. Target Commit (Current HEAD on main)
      $toCommit = "$(Build.SourceVersion)"
      if ([string]::IsNullOrWhiteSpace($toCommit)) {
          $toCommit = (git rev-parse HEAD).Trim()
      }

      # 2. Identify Parents of the Commit
      $parents = (git rev-list --parents -n 1 $toCommit).Trim() -split '\s+'
      
      if ($parents.Count -gt 2) {
          # 3-Way Merge Commit: Parent 1 is the state of main before the merge
          $fromCommit = $parents[1].Trim()
          Write-Host "Detected 3-Way Merge Commit (Parents: $($parents.Count - 1))"
      } else {
          # Squash Merge or Direct Push: Base is HEAD~1
          $fromCommit = (git rev-parse "$toCommit~1").Trim()
          Write-Host "Detected Squash Merge / Single Commit"
      }

      Write-Host "================= COMMIT RANGE ================="
      Write-Host "From Commit (-fc): $fromCommit"
      Write-Host "To Commit   (-tc): $toCommit"
      Write-Host "Target Server:     $(server)"
      Write-Host "================================================"

      # 3. Print Modified Files for Confirmation
      Write-Host "=== FILES CHANGED IN GIT ==="
      git diff --name-status $fromCommit $toCommit
      Write-Host "============================"

      if ($fromCommit -eq $toCommit) {
          Write-Error "From-commit and To-commit are identical ($fromCommit). No changes detected."
          exit 1
      }

      $outputVql = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      # 4. Execute export.bat --revision
      Push-Location "$(denodoPath)"
      try {
          Write-Host "Running export.bat --revision..."
          
          .\export.bat --revision `
            -l "$env:VDP_USER" `
            -p "$env:VDP_PASSWORD" `
            -h "$(server)" `
            -f "$outputVql" `
            -fc "$fromCommit" `
            -tc "$toCommit" `
            -P "includeprivileges=yes"

          if ($LASTEXITCODE -ne 0) {
              throw "export.bat failed with exit code $LASTEXITCODE"
          }
          
          Write-Host "Revision successfully generated at: $outputVql"
      }
      finally {
          Pop-Location
      }
    displayName: 'Generate Incremental Workspace Revision'
    env:
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)

  # 4. Verify Generated VQL Output
  - powershell: |
      $revisionFile = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"
      
      if (!(Test-Path $revisionFile)) {
          Write-Error "Revision file $revisionFile was not created."
          exit 1
      }

      $content = Get-Content $revisionFile -Raw
      Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
      Write-Host $content

      if ($content -match "No diff elements between commits" -or [string]::IsNullOrWhiteSpace($content)) {
          Write-Error "Denodo generated an empty revision (# No diff elements between commits). Aborting deployment."
          exit 1
      }
    displayName: 'Verify Generated VQL Output'

  # 5. Publish Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'
    displayName: 'Publish Revision Artifact'

  # 6. Deploy via Solution Manager API
  - powershell: |
      $scriptPath = Join-Path "$(Build.SourcesDirectory)" "base64revision.py"
      if (!(Test-Path $scriptPath)) {
          $scriptPath = Join-Path "$(pipelineTmpPath)" "base64revision.py"
      }

      $revisionVqlPath = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      Write-Host "Executing deployment script: $scriptPath"
      python "$scriptPath" `
        -s "$(smHost)" `
        -p "$(smPort)" `
        -v "$revisionVqlPath" `
        -n "Auto_Build_$(Build.BuildId)" `
        -d "Automated deployment from commit $(Build.SourceVersion)" `
        -e $(targetEnvId) `
        -u "$env:SM_USER" `
        -a "$env:SM_PASSWORD" `
        --protocol "http"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 7. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()