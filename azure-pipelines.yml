trigger:
  branches:
    include:
      - main

pr: none

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:\Users\hariharan.d\denodo\denodo-db-tools\bin'
  pipelineTmpPath: 'C:\Users\hariharan.d\Denodo\pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vdbName: 'resort360'
  
  # Server Connection Details
  vdpHost: 'devdenodo-9.iqzsystems.io'
  vdpPort: '9999'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoGitHubWorkspaceCI
  displayName: 'Denodo 9 GitHub Workspace CI/CD'
  steps:
  
  # 1. Full Git checkout from GitHub
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  # 2. Initialize Directory
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { 
          New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force 
          Write-Host "Created temporary folder at: $(pipelineTmpPath)"
      }
    displayName: 'Initialize Pipeline Folder'

  # 3. Resolve GitHub Commits and Generate Incremental Revision
  - powershell: |
      $ErrorActionPreference = 'Stop'
      Set-Location "$(Build.SourcesDirectory)"

      # Get Trigger Commit SHA from GitHub
      $toCommit = "$(Build.SourceVersion)"
      if ([string]::IsNullOrWhiteSpace($toCommit)) {
          $toCommit = (git rev-parse HEAD).Trim()
      }

      # Inspect commit parents to determine GitHub PR merge type
      $parents = (git rev-list --parents -n 1 $toCommit).Trim() -split '\s+'
      
      if ($parents.Count -gt 2) {
          # GitHub 'Create a merge commit' -> Parent 1 is main before merge
          $fromCommit = $parents[1].Trim()
          Write-Host "Detected GitHub PR 3-Way Merge Commit."
      } else {
          # GitHub 'Squash and merge' or direct push -> Compare with HEAD~1
          $fromCommit = (git rev-parse "$toCommit~1").Trim()
          Write-Host "Detected GitHub Squash Merge or Direct Push."
      }

      Write-Host "================= GITHUB COMMIT RANGE ================="
      Write-Host "GitHub SHA To   (-tc): $toCommit"
      Write-Host "GitHub SHA From (-fc): $fromCommit"
      Write-Host "======================================================="

      # Print files changed in GitHub
      Write-Host "=== FILES CHANGED IN GITHUB REPO ==="
      git diff --name-status $fromCommit $toCommit
      Write-Host "===================================="

      if ($fromCommit -eq $toCommit) {
          Write-Error "From-commit and To-commit are identical ($fromCommit). No changes to export."
          exit 1
      }

      $outputVql = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      Push-Location "$(denodoPath)"
      try {
          # Primary Attempt: Connect to database endpoint //devdenodo-9:9999/resort360
          $targetUrl = "//$(vdpHost):$(vdpPort)/$(vdbName)"
          Write-Host "Connecting export.bat to: $targetUrl"

          .\export.bat --revision `
            -l "$env:VDP_USER" `
            -p "$env:VDP_PASSWORD" `
            -h "$targetUrl" `
            -f "$outputVql" `
            -fc "$fromCommit" `
            -tc "$toCommit" `
            -P "includeprivileges=yes"

          # Fallback Check: If database level returned empty, retry connecting to /admin
          $vqlContent = Get-Content "$outputVql" -Raw -ErrorAction SilentlyContinue
          if ($vqlContent -match "No diff elements between commits" -or [string]::IsNullOrWhiteSpace($vqlContent)) {
              Write-Warning "Database scope returned empty. Retrying with /admin endpoint..."
              
              $adminUrl = "//$(vdpHost):$(vdpPort)/admin"
              .\export.bat --revision `
                -l "$env:VDP_USER" `
                -p "$env:VDP_PASSWORD" `
                -h "$adminUrl" `
                -f "$outputVql" `
                -fc "$fromCommit" `
                -tc "$toCommit" `
                -P "includeprivileges=yes"
          }

          if ($LASTEXITCODE -ne 0) {
              throw "export.bat failed with exit code $LASTEXITCODE"
          }
      }
      finally {
          Pop-Location
      }
    displayName: 'Generate Incremental Workspace Revision'
    env:
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)

  # 4. Verify Generated VQL Output
  - powershell: |
      $revisionFile = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"
      
      if (!(Test-Path $revisionFile)) {
          Write-Error "Revision file $revisionFile was not created."
          exit 1
      }

      $content = Get-Content $revisionFile -Raw
      Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
      Write-Host $content

      if ($content -match "No diff elements between commits" -or [string]::IsNullOrWhiteSpace($content)) {
          Write-Error "Denodo returned '# No diff elements between commits'. Verify that the VDP Server can connect to GitHub and fetch the latest commits."
          exit 1
      }
    displayName: 'Verify Generated VQL Output'

  # 5. Publish Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'
    displayName: 'Publish Revision Artifact'

  # 4. Deploy via Solution Manager API
  - powershell: |
      Set-Location "$(pipelineTmpPath)"
      python base64revision.py -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)/$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment from Azure Pipeline" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 7. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()