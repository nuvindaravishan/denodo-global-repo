trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:/Users/hariharan.d/denodo/denodo-db-tools/bin'
  pipelineTmpPath: 'C:/Users/hariharan.d/Denodo/pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vdbName: 'resort360'
  repositoryName: 'denodo-global-repo'
  
  # Host for import.bat (MUST start with //)
  vdpImportServer: '//devdenodo-9.iqzsystems.io:9999/resort360'
  
  # Host for export.bat (MUST NOT start with //)
  vdpExportServer: 'devdenodo-9.iqzsystems.io:9999/resort360'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # 1. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force }
    displayName: 'Initialize Pipeline Folder'

  # 2. Extract Incremental Revision for resort360
  - powershell: |
      $env:JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"
      $env:DENODO_JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"
      
      # Step 2a: Create VQL script to pull remote 'main' branch
      "DVCSPULL $env:VDB_NAME;" | Out-File -FilePath "$(pipelineTmpPath)/pull.vql" -Encoding utf8
      
      Set-Location "$(denodoPath)"
      
      # Step 2b: Execute DVCSPULL (Uses vdpImportServer with //)
      Write-Host "Syncing Dev VDP database '$env:VDB_NAME' with GitHub main branch..."
      .\import.bat --file "$(pipelineTmpPath)/pull.vql" --server "$env:VDP_IMPORT_SERVER?$env:VDP_USER@$env:VDP_PASSWORD"
      
      # Step 2c: Generate Incremental Revision (Uses vdpExportServer WITHOUT //)
      Write-Host "Generating incremental VQL revision for database '$env:VDB_NAME'..."
      .\export.bat --revision -l "$env:VDP_USER" -p "$env:VDP_PASSWORD" -h "$env:VDP_EXPORT_SERVER" -P repositoryName="$env:REPO_NAME" -f "$(pipelineTmpPath)/$(REVISION_NAME)" -fc HEAD~1 -tc HEAD -P includeprivileges=yes -P includeEnvSpecificElements=yes -P includeNonEnvSpecificElements=yes -P includeServerElements=no
      
      # Step 2d: Sanitize revision file
      if (Test-Path "$(pipelineTmpPath)/$(REVISION_NAME)") {
          Write-Host "Sanitizing revision VQL file..."
          $fileContent = Get-Content "$(pipelineTmpPath)/$(REVISION_NAME)"
          $cleanContent = $fileContent | Where-Object { $_ -notlike "*DROP DATABASE*" }
          $cleanContent | Set-Content "$(pipelineTmpPath)/$(REVISION_NAME)"
      }
    displayName: 'Extract Incremental VQL Revision from Dev VDP'
    env:
      VDB_NAME: $(vdbName)
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)
      VDP_IMPORT_SERVER: $(vdpImportServer)
      VDP_EXPORT_SERVER: $(vdpExportServer)
      REPO_NAME: $(repositoryName)

  # 3. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 4. Deploy via Solution Manager API
  - powershell: |
      Set-Location "$(pipelineTmpPath)"
      python base64revision.py -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)/$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment from Azure Pipeline" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 5. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()