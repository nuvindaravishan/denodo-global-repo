trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:/Users/hariharan.d/denodo/denodo-db-tools/bin'
  pipelineTmpPath: 'C:/Users/hariharan.d/Denodo/pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vdbName: 'resort360'
  
  # Dev VDP Details (Separated Host and Database)
  vdpHost: 'devdenodo-9.iqzsystems.io:9999'
  
  # Machine B Details (Solution Manager)
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # 1. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force }
    displayName: 'Initialize Pipeline Folder'

  # 2. Extract Incremental VQL Revision from Dev VDP
  - powershell: |
      $env:JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"
      $env:DENODO_JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"

      if ([string]::IsNullOrWhiteSpace($env:VDP_USER) -or [string]::IsNullOrWhiteSpace($env:VDP_PASSWORD)) {
          Write-Error "VDP_USER or VDP_PASSWORD pipeline secret is missing or empty!"
          exit 1
      }

      # Step 2a: Write DVCSPULL for the connected database (resort360)
      $pullVqlPath = "$(pipelineTmpPath)/pull.vql"
      $vqlCommand = 'DVCSPULL ' + $env:VDB_NAME + ';'
      Write-Host "Creating pull.vql with command: $vqlCommand"
      [System.IO.File]::WriteAllText($pullVqlPath, $vqlCommand)

      Set-Location "$(denodoPath)"

      # Step 2b: Construct URI using raw credentials
      $serverUri = "//" + $env:VDP_HOST + "/" + $env:VDB_NAME + "?" + $env:VDP_USER + "@" + $env:VDP_PASSWORD

      # Step 2c: Execute DVCSPULL against the connected database
      Write-Host "Syncing Dev VDP database '$env:VDB_NAME' with GitHub main branch..."
      
      $oldEap = $ErrorActionPreference
      $ErrorActionPreference = 'Continue'
      
      $importOutput = & .\import.bat --singleuser --file "$pullVqlPath" --server "$serverUri" 2>&1 | Out-String
      
      $ErrorActionPreference = $oldEap

      Write-Host $importOutput

      # Step 2d: Error validation
      $hasErrors = ($importOutput -match "#Errors:\s*[1-9]") -or ($importOutput -like "*authentication error*") -or ($importOutput -like "*BATCH EXECUTION FAILED*")
      if ($hasErrors) {
          Write-Error "DVCSPULL failed! Resolve the import error above before exporting revision."
          exit 1
      }

      # Step 2e: Export Revision matching official Denodo Azure DevOps specification
      $targetCommit = "$(Build.SourceVersion)"
      Write-Host "Generating incremental VQL revision for commit '$targetCommit'..."
      
      .\export.bat --revision -l "$env:VDP_USER" -p "$env:VDP_PASSWORD" -h "$env:VDP_HOST" -f "$(pipelineTmpPath)/$(REVISION_NAME)" -fc HEAD~1 -tc "$targetCommit" -P includeprivileges=yes -P includeServerElements=no

      # Step 2f: Fallback check if HEAD~1 returns empty
      $content = Get-Content "$(pipelineTmpPath)/$(REVISION_NAME)" -Raw
      $trimmedContent = if ($content) { $content.Trim() } else { "" }
      
      if ($trimmedContent -like "*No diff elements between commits*" -or $trimmedContent -eq "# #######################################`r`n# DELETED ELEMENTS`r`n# #######################################" -or $trimmedContent -eq "# #######################################`n# DELETED ELEMENTS`n# #######################################") {
          Write-Host "HEAD~1 returned no diffs. Retrying with HEAD~2..."
          .\export.bat --revision -l "$env:VDP_USER" -p "$env:VDP_PASSWORD" -h "$env:VDP_HOST" -f "$(pipelineTmpPath)/$(REVISION_NAME)" -fc HEAD~2 -tc "$targetCommit" -P includeprivileges=yes -P includeServerElements=no
      }

      # Step 2g: Sanitize revision file
      Write-Host "Sanitizing revision VQL file..."
      $fileContent = Get-Content "$(pipelineTmpPath)/$(REVISION_NAME)"
      $cleanContent = $fileContent | Where-Object { $_ -notlike "*DROP DATABASE*" }
      $cleanContent | Set-Content "$(pipelineTmpPath)/$(REVISION_NAME)"

      Write-Host "=== FINAL GENERATED REVISION FILE OUTPUT ==="
      Get-Content "$(pipelineTmpPath)/$(REVISION_NAME)"
    displayName: 'Extract Incremental VQL Revision from Dev VDP'
    env:
      VDB_NAME: $(vdbName)
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)
      VDP_HOST: $(vdpHost)
  # 3. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 4. Deploy via Solution Manager API
  - powershell: |
      Set-Location "$(pipelineTmpPath)"
      python base64revision.py -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)/$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment from Azure Pipeline" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)
  # 5. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()