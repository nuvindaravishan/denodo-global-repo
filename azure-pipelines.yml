trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:\Users\hariharan.d\denodo\denodo-db-tools\bin'
  pipelineTmpPath: 'C:\Users\hariharan.d\Denodo\pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vqlPullFile: 'vcs_pull.vql'
  vdbName: 'resort360'
  
  # VDP Server Details
  vdpHost: 'devdenodo-9.iqzsystems.io'
  vdpPort: '9999'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  - checkout: self
    fetchDepth: 0

  # 1. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { 
          New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force 
      }
    displayName: 'Initialize Pipeline Folder'

  # 2. Synchronize resort360 VDB and Generate Incremental Revision
  - powershell: |
      $pullVqlPath = Join-Path "$(pipelineTmpPath)" "vcs_pull.vql"
      $outputVql   = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"

      # --- Step A: Write DVCSPULL for resort360 ---
      "DVCSPULL $(vdbName);" | Out-File -FilePath $pullVqlPath -Encoding ascii -Force
      Write-Host "Created VCS pull file for database $(vdbName): $pullVqlPath"

      # Navigate to Denodo bin directory
      Write-Host "Navigating to Denodo bin directory: $(denodoPath)"
      Push-Location "$(denodoPath)"

      try {
          # --- Step B: Trigger DVCSPULL on resort360 ---
          Write-Host "========================================="
          Write-Host "Step 1: Pulling Git changes into $(vdbName)..."
          Write-Host "========================================="
          
          $serverParam = "//$(vdpHost):$(vdpPort)/$(vdbName)?$($env:VDP_USER)@$($env:VDP_PASSWORD)"
          
          # Run import.bat and display full output
          .\import.bat --singleuser --file "$pullVqlPath" --server "$serverParam"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "DVCSPULL failed with exit code $LASTEXITCODE."
              exit $LASTEXITCODE
          }
          Write-Host "Database $(vdbName) successfully synchronized with Git."

          # --- Step C: Run export.bat using HEAD~1 to HEAD ---
          Write-Host "========================================="
          Write-Host "Step 2: Generating incremental revision for $(vdbName)..."
          Write-Host "From: HEAD~1"
          Write-Host "To:   HEAD"
          Write-Host "========================================="

          # Using -tc HEAD ensures export compares against the commit just pulled by VDP
          .\export.bat --revision `
            -l "$env:VDP_USER" `
            -p "$env:VDP_PASSWORD" `
            -h "//$($env:vdpHost):$($env:vdpPort)/$(vdbName)" `
            -f "$outputVql" `
            -fc "HEAD~1" `
            -tc "HEAD" `
            -P "includeprivileges=yes"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "export.bat failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          Write-Host "Incremental revision VQL created successfully at: $outputVql"
      }
      finally {
          Pop-Location
      }
    displayName: 'Sync resort360 with Git and Generate Incremental Revision'
    env:
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)
      vdpHost: $(vdpHost)
      vdpPort: $(vdpPort)
  # 4. Verify Generated VQL
  - powershell: |
      $revisionFile = Join-Path "$(pipelineTmpPath)" "$(REVISION_NAME)"
      if (Test-Path $revisionFile) {
          Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
          Get-Content $revisionFile
      } else {
          Write-Error "Revision file $revisionFile was not generated."
          exit 1
      }
    displayName: 'Verify Generated VQL Output'

  # 5. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 6. Deploy via Solution Manager API
  - powershell: |
      python "$(pipelineTmpPath)\base64revision.py" `
        -s "$(smHost)" `
        -p "$(smPort)" `
        -v "$(pipelineTmpPath)\$(REVISION_NAME)" `
        -n "Auto_Build_$(Build.BuildId)" `
        -d "Automated deployment from Azure Pipeline commit $(Build.SourceVersion)" `
        -e $(targetEnvId) `
        -u "$env:SM_USER" `
        -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 7. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
      if exist "$(pipelineTmpPath)\$(vqlPullFile)" del /f /q "$(pipelineTmpPath)\$(vqlPullFile)"
    displayName: 'Cleanup Temp Files'
    condition: always()