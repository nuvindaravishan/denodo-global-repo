trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  # Path to Denodo Platform bin folder containing export.bat
  denodoPath: 'C:\Denodo\DenodoPlatform9.0\bin'
  pipelineTmpPath: 'C:\Users\hariharan.d\Denodo\pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  
  # VDP Server Details (where Git workspace/main is connected)
  vdpServer: '//localhost:9999/admin'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # 1. Checkout repository with full commit history for commit comparison
  - checkout: self
    fetchDepth: 0

  # 2. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) {
          New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force
      }
    displayName: 'Initialize Pipeline Folder'

  # 3. Generate Incremental VQL Revision via Denodo export.bat
  - script: |
      echo Generating incremental revision from HEAD~1 to $(Build.SourceVersion)...
      cd /d $(denodoPath)
      
      export.bat --revision ^
        -l $(VDP_USER) ^
        -p $(VDP_PASSWORD) ^
        -h $(vdpServer) ^
        -f "$(pipelineTmpPath)\$(REVISION_NAME)" ^
        -fc HEAD~1 ^
        -tc $(Build.SourceVersion) ^
        -P includeprivileges=yes
    displayName: 'Generate Incremental Workspace Revision'
    env:
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)

  # 4. Display the Generated Incremental VQL (For verification in build logs)
  - powershell: |
      $revisionFile = "$(pipelineTmpPath)\$(REVISION_NAME)"
      if (Test-Path $revisionFile) {
          Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
          Get-Content $revisionFile
      } else {
          Write-Error "Revision file was not generated!"
          exit 1
      }
    displayName: 'Verify Generated VQL Output'

  # 5. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 6. Deploy via Solution Manager API
  - powershell: |
      python "$(pipelineTmpPath)\base64revision.py" -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)\$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment from Azure Pipeline commit $(Build.SourceVersion)" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 7. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()