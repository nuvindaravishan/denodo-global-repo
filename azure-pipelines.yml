trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:/Users/hariharan.d/denodo/denodo-db-tools/bin'
  pipelineTmpPath: 'C:/Users/hariharan.d/Denodo/pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vdbName: 'resort360'
  
  # Machine B Details (Solution Manager)
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # Checkout repository with full commit history for git diff
  - checkout: self
    fetchDepth: 0

  # 1. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force }
    displayName: 'Initialize Pipeline Folder'

  # 2. Extract Incremental VQL Revision directly from Git Changes
  - powershell: |
      Set-Location "$(Build.SourcesDirectory)"
      
      Write-Host "Detecting changed VQL files in commit $(Build.SourceVersion)..."
      
      # Find all .vql files modified or added in the latest commit
      $changedFiles = git diff --name-only HEAD~1 HEAD | Where-Object { $_ -like "*.vql" }
      
      if (-not $changedFiles) {
          Write-Host "No .vql files changed in HEAD~1..HEAD. Checking HEAD~2..HEAD..."
          $changedFiles = git diff --name-only HEAD~2 HEAD | Where-Object { $_ -like "*.vql" }
      }

      Write-Host "Changed VQL Files:"
      $changedFiles | ForEach-Object { Write-Host " - $_" }

      $revisionPath = "$(pipelineTmpPath)/$(REVISION_NAME)"
      
      if (Test-Path $revisionPath) { Remove-Item $revisionPath -Force }

      if ($changedFiles) {
          foreach ($file in $changedFiles) {
              if (Test-Path $file) {
                  Write-Host "Appending content from: $file"
                  Get-Content $file -Raw | Out-File -FilePath $revisionPath -Encoding utf8 -Append
                  Add-Content -Path $revisionPath -Value "`r`n`r`n"
              }
          }
      } else {
          Write-Error "No modified .vql files found in the commit range!"
          exit 1
      }

      # Sanitize revision file to remove any unwanted DROP DATABASE statements
      Write-Host "Sanitizing revision VQL file..."
      $fileContent = Get-Content $revisionPath
      $cleanContent = $fileContent | Where-Object { $_ -notlike "*DROP DATABASE*" }
      $cleanContent | Set-Content $revisionPath

      Write-Host "=== INCREMENTAL REVISION VQL OUTPUT ==="
      Get-Content $revisionPath
    displayName: 'Extract Incremental VQL Revision from Git'

  # 3. Publish VQL Build Artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 4. Deploy via Solution Manager API
  - powershell: |
      Set-Location "$(pipelineTmpPath)"
      python base64revision.py -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)/$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment from Azure Pipeline" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 5. Cleanup Temporary Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()