trigger:
  - main

pool:
  name: 'denodo_git'

variables:
  denodoPath: 'C:/Users/hariharan.d/denodo/denodo-db-tools/bin'
  pipelineTmpPath: 'C:/Users/hariharan.d/Denodo/pipeline_files'
  REVISION_NAME: 'Revision_$(Build.BuildId).vql'
  vdbName: 'resort360'
  
  # Dev VDP Host & Port with Target Database
  vdpServer: 'devdenodo-9.iqzsystems.io:9999/resort360'
  
  # Solution Manager Details
  smHost: 'denodosm-9.iqzsystems.io'
  smPort: '10090'
  targetEnvId: 8

jobs:
- job: DenodoCICDJob
  steps:
  
  # 1. Initialize Pipeline Folder
  - powershell: |
      if (!(Test-Path "$(pipelineTmpPath)")) { New-Item -ItemType Directory -Path "$(pipelineTmpPath)" -Force }
    displayName: 'Initialize Pipeline Folder'

  # 2. Extract Incremental VQL Revision from Dev VDP
  - powershell: |
      $env:JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"
      $env:DENODO_JAVA_OPTS="-Dcom.denodo.vdp.vdb.vdbinterface.server.ssl.trustAll=true"
      
      # Step 2a: Switch VDP to 'main' branch FIRST, then pull the merged PR
      $vqlScript = @"
      DVCS CHECKOUT 'main' FOR DATABASE $env:VDB_NAME;
      DVCSPULL $env:VDB_NAME;
      "@
      $vqlScript | Out-File -FilePath "$(pipelineTmpPath)/pull.vql" -Encoding utf8
      
      Set-Location "$(denodoPath)"
      
      # Step 2b: Execute Checkout & Pull on Dev VDP
      Write-Host "Checking out 'main' branch and pulling latest PR changes for database '$env:VDB_NAME'..."
      .\import.bat --file "$(pipelineTmpPath)/pull.vql" --server "$(vdpServer)?$env:VDP_USER@$env:VDP_PASSWORD"
      
      # Step 2c: Generate Incremental Revision strictly between HEAD~1 and HEAD on main
      Write-Host "Generating incremental VQL revision..."
      .\export.bat --revision -l "$env:VDP_USER" -p "$env:VDP_PASSWORD" -h "$(vdpServer)" -f "$(pipelineTmpPath)/$(REVISION_NAME)" -fc HEAD~1 -tc HEAD -P includeprivileges=yes
    displayName: 'Extract Incremental VQL Revision from Dev VDP'
    env:
      VDB_NAME: $(vdbName)
      VDP_USER: $(VDP_USER)
      VDP_PASSWORD: $(VDP_PASSWORD)
  # 3. Publish Build Artifacts
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(pipelineTmpPath)/$(REVISION_NAME)'
      ArtifactName: 'VQL_Revision'
      publishLocation: 'Container'

  # 4. Deploy via Solution Manager API
  - powershell: |
      Set-Location "$(pipelineTmpPath)"
      python base64revision.py -s "$(smHost)" -p "$(smPort)" -v "$(pipelineTmpPath)/$(REVISION_NAME)" -n "Auto_Build_$(Build.BuildId)" -d "Automated deployment for PR $(Build.BuildId)" -e $(targetEnvId) -u "$env:SM_USER" -a "$env:SM_PASSWORD"
    displayName: 'Deploy via Solution Manager API'
    env:
      SM_USER: $(SM_USER)
      SM_PASSWORD: $(SM_PASSWORD)

  # 5. Cleanup Temp Files
  - script: |
      if exist "$(pipelineTmpPath)\$(REVISION_NAME)" del /f /q "$(pipelineTmpPath)\$(REVISION_NAME)"
    displayName: 'Cleanup Temp Files'
    condition: always()